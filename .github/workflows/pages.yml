# Публикует webapp/ как сайт, чтобы программой можно было воспользоваться
# сразу, без скачивания и без Python — открыл ссылку и работаешь.
#
# Отдельным рабочим процессом, а не настройкой «ветка + папка»: GitHub Pages
# умеет отдавать только корень репозитория или /docs, а сайт лежит в webapp/.
#
# Что важно понимать про эту копию: разбор PDF в браузере там работает точно
# так же — он и так весь на устройстве, — но связи с телефоном нет. Она держится
# на локальном сервере (tools/lan_server.py), которого на Pages не бывает.
name: Публикация сайта

on:
  push:
    branches: [main]
    paths: ["webapp/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: webapp
      - id: deployment
        uses: actions/deploy-pages@v4
